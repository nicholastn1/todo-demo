name: Pull Request Validation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 24 to match mise.toml: vite@8 requires >=22.12.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `build` is `tsc -b && vite build`, so this is the typecheck too.
      - name: Typecheck and build
        run: npm run build

      - name: Test
        run: npm test

      - name: Test repository scripts
        run: npm run test:scripts
